    <style>
        :root {
            --red: #E63946; --red-dark: #C1121F; --green: #10B981; --green-dark: #059669;
            --blue: #3B82F6; --yellow: #F59E0B; --bg: #f0f4f8; --card: #ffffff;
            --text: #1e293b; --muted: #64748b; --border: #e2e8f0; --shadow: 0 4px 24px rgba(0,0,0,0.07);
            --shadow-lg: 0 20px 60px rgba(0,0,0,0.13); --radius: 20px; --radius-sm: 12px;
        }
        [data-theme="dark"] {
            --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --muted: #94a3b8;
            --border: #334155; --shadow: 0 4px 24px rgba(0,0,0,0.3);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--text); padding-bottom: 100px; min-height: 100vh; overflow-x: hidden; }
        a { text-decoration: none; color: inherit; }

        .container { max-width: 900px; margin: 0 auto; padding: 2rem 1.25rem; }
        .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem; gap: 1rem; flex-wrap: wrap; }
        .page-title { font-size: 1.6rem; font-weight: 700; }
        .page-title span { color: var(--red); }

        .card { background: var(--card); border-radius: var(--radius); padding: 1.75rem; box-shadow: var(--shadow); border: 1px solid var(--border); margin-bottom: 1.25rem; }
        .card-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 1rem; }
        .card-meta { font-size: 0.82rem; color: var(--muted); }

        .btn { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.7rem 1.5rem; border-radius: 9999px; font-weight: 600; font-size: 0.9rem; cursor: pointer; border: none; font-family: 'Outfit', sans-serif; transition: transform 0.15s, opacity 0.15s; }
        .btn:active { transform: scale(0.97); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-red { background: var(--red); color: #fff; } .btn-red:hover { background: var(--red-dark); }
        .btn-green { background: var(--green); color: #fff; } .btn-green:hover { background: var(--green-dark); }
        .btn-blue { background: var(--blue); color: #fff; } .btn-yellow { background: var(--yellow); color: #000; }
        .btn-outline { background: transparent; border: 2px solid var(--border); color: var(--text); }
        .btn-sm { padding: 0.45rem 1rem; font-size: 0.8rem; }
        .btn-danger { background: #fee2e2; color: var(--red-dark); }
        .btn-full { width: 100%; justify-content: center; }

        .form-group { margin-bottom: 1.1rem; position: relative; }
        .form-label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--muted); margin-bottom: 0.4rem; text-transform: uppercase; letter-spacing: 0.04em; }
        .form-control, .form-select { width: 100%; padding: 0.9rem 1.1rem; border: 2px solid var(--border); border-radius: var(--radius-sm); background: var(--bg); color: var(--text); font-family: 'Outfit', sans-serif; font-size: 0.95rem; }
        .form-control:focus, .form-select:focus { outline: none; border-color: var(--red); }
        textarea.form-control { resize: vertical; min-height: 100px; }
        
        .toggle-password { position: absolute; right: 1rem; top: 2.3rem; cursor: pointer; color: var(--muted); font-size: 1.1rem; }
        .toggle-password:hover { color: var(--text); }

        .badge { display: inline-block; padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.72rem; font-weight: 700; }
        .badge-red { background: #fee2e2; color: var(--red-dark); }
        .badge-green { background: #d1fae5; color: #065f46; }
        .badge-blue { background: #dbeafe; color: #1d4ed8; }
        .badge-yellow { background: #fef3c7; color: #92400e; }
        .badge-muted { background: var(--border); color: var(--muted); }

        /* Filter Status Bar */
        .filter-status-bar { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; }
        .filter-btn { padding: 0.45rem 1rem; border-radius: 9999px; font-size: 0.82rem; font-weight: 600; border: 1px solid var(--border); background: var(--bg); color: var(--muted); cursor: pointer; transition: 0.2s; }
        .filter-btn.active { background: var(--red); color: white; border-color: var(--red); }

        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.55); backdrop-filter: blur(6px); display: none; align-items: center; justify-content: center; z-index: 2000; padding: 1rem; }
        .modal-overlay.show { display: flex; }
        .modal-box { background: var(--card); padding: 2.5rem; border-radius: 28px; width: 100%; max-width: 460px; box-shadow: var(--shadow-lg); max-height: 90vh; overflow-y: auto; }
        .modal-icon { font-size: 2.5rem; color: var(--red); margin-bottom: 1rem; }
        .modal-title { font-size: 1.4rem; font-weight: 800; margin-bottom: 0.3rem; }
        .modal-sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 2rem; }
        .modal-tabs { display: flex; gap: 0.5rem; margin-bottom: 2rem; }
        .modal-tab { flex: 1; padding: 0.65rem; border-radius: var(--radius-sm); border: 2px solid var(--border); font-weight: 600; font-size: 0.88rem; cursor: pointer; background: transparent; color: var(--muted); transition: all 0.2s; }
        .modal-tab.active { background: var(--red); border-color: var(--red); color: white; }

        .hero { text-align: center; padding: 4rem 1.5rem 3rem; background: linear-gradient(135deg, #fff 0%, #fff8f8 100%); border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow); margin-bottom: 2rem; overflow: hidden; }
        [data-theme="dark"] .hero { background: linear-gradient(135deg, #1e293b, #16213e); }
        .hero-logo { font-size: 3.5rem; font-weight: 800; line-height: 1; margin-bottom: 0.5rem; }
        .hero-logo .imc { color: var(--red); }
        .hero-sub { font-size: 1rem; color: var(--muted); margin-bottom: 2rem; max-width: 420px; margin-left: auto; margin-right: auto; }
        .hero-btns { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
        .stat-card { background: var(--card); border-radius: var(--radius); padding: 1.25rem; border: 1px solid var(--border); text-align: center; box-shadow: var(--shadow); }
        .stat-num { font-size: 1.8rem; font-weight: 800; }
        .stat-label { font-size: 0.78rem; color: var(--muted); font-weight: 600; margin-top: 0.2rem; }

        .jadwal-item { display: flex; gap: 1rem; align-items: flex-start; padding: 1.1rem 0; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
        .jadwal-item:last-child { border-bottom: none; }
        .jadwal-date { min-width: 58px; text-align: center; background: #fee2e2; border-radius: var(--radius-sm); padding: 0.5rem 0.2rem; color: var(--red-dark); font-weight: 700; }
        .jadwal-date .day-name { font-size: 0.68rem; text-transform: uppercase; font-weight: 800; display: block; margin-bottom: 0.1rem; }
        .jadwal-date .day { font-size: 1.4rem; line-height: 1; }
        .jadwal-date .month { font-size: 0.68rem; text-transform: uppercase; }
        .jadwal-info { flex: 1; min-width: 160px; }
        .jadwal-title { font-weight: 700; margin-bottom: 0.2rem; display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
        .jadwal-meta { font-size: 0.82rem; color: var(--muted); display:flex; flex-wrap:wrap; align-items:center; gap: 0.3rem; margin-top: 0.2rem; }

        .week-controls { display: flex; align-items: center; justify-content: space-between; background: var(--card); padding: 1rem; border-radius: var(--radius); border: 1px solid var(--border); margin-bottom: 1.25rem; font-weight: 700; box-shadow: var(--shadow); }
        .week-controls button { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 0.5rem 1rem; cursor: pointer; color: var(--text); font-family: 'Outfit'; transition: 0.2s; }
        .week-controls button:hover { background: var(--red); color: #fff; border-color: var(--red); }
        .week-label { font-size: 0.9rem; letter-spacing: 0.02em; }

        .chat-container { display: flex; flex-direction: column; height: 60vh; background: var(--card); border-radius: var(--radius); border: 1px solid var(--border); overflow: hidden; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; }
        .chat-bubble { max-width: 80%; padding: 0.8rem 1rem; border-radius: 16px; font-size: 0.95rem; line-height: 1.4; position: relative; word-wrap: break-word; }
        .chat-bubble.me { align-self: flex-end; background: var(--blue); color: white; border-bottom-right-radius: 4px; }
        .chat-bubble.other { align-self: flex-start; background: var(--bg); color: var(--text); border-bottom-left-radius: 4px; border: 1px solid var(--border); }
        .chat-sender { font-size: 0.75rem; font-weight: 700; margin-bottom: 0.3rem; opacity: 0.8; display: flex; justify-content: space-between; gap: 1rem; }
        .chat-time { font-size: 0.65rem; opacity: 0.7; }
        .chat-input-area { padding: 1rem; background: var(--bg); border-top: 1px solid var(--border); display: flex; gap: 0.5rem; }

        .file-item { display: flex; align-items: center; gap: 1rem; padding: 1rem; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--bg); margin-bottom: 0.75rem; transition: box-shadow 0.2s; flex-wrap: wrap; }
        .file-icon { font-size: 1.8rem; width: 40px; text-align: center; }
        .file-info { flex: 1; min-width: 160px; }
        .file-name { font-weight: 600; font-size: 0.95rem; }
        .file-meta { font-size: 0.8rem; color: var(--muted); margin-top: 0.15rem; display:flex; flex-wrap:wrap; align-items:center; gap:0.3rem; }
        .file-actions { display: flex; gap: 0.5rem; }

        #bottom-ribbon { position: fixed; bottom: 0; left: 0; width: 100%; z-index: 1000; background: var(--card); border-top: 1px solid var(--border); box-shadow: 0 -8px 32px rgba(0,0,0,0.08); transition: transform 0.35s, opacity 0.35s; }
        #bottom-ribbon.hidden { transform: translateY(100%); opacity: 0; pointer-events: none; }
        .ribbon-inner { display: flex; justify-content: space-around; align-items: center; padding: 0.6rem 0.5rem; max-width: 700px; margin: 0 auto; }
        .ribbon-btn { display: flex; flex-direction: column; align-items: center; gap: 0.25rem; padding: 0.5rem 1rem; border-radius: var(--radius-sm); border: none; background: transparent; color: var(--muted); cursor: pointer; font-family: 'Outfit'; font-size: 0.7rem; font-weight: 600; min-width: 60px; }
        .ribbon-btn i { font-size: 1.2rem; }
        .ribbon-btn.active, .ribbon-btn:hover { color: var(--red); background: #fee2e2; }

        .top-bar { background: var(--card); border-bottom: 1px solid var(--border); padding: 1rem 1.25rem; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        .top-logo { font-weight: 800; font-size: 1.1rem; }
        .top-logo span { color: var(--red); }
        .top-right { display: flex; align-items: center; gap: 0.75rem; }
        .user-chip { display: flex; align-items: center; gap: 0.5rem; background: var(--bg); border-radius: 9999px; padding: 0.4rem 0.9rem; font-size: 0.82rem; font-weight: 600; border: 1px solid var(--border); cursor: pointer; }
        .avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--red); color: white; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.8rem; }
        .theme-btn { background: var(--bg); border: 1px solid var(--border); border-radius: 9999px; padding: 0.45rem 0.85rem; cursor: pointer; font-size: 0.9rem; color: var(--text); }

        .user-menu { position: relative; }
        .user-menu-dropdown { display: none; position: absolute; top: 100%; right: 0; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm); box-shadow: var(--shadow-lg); min-width: 160px; z-index: 500; margin-top: 0.5rem; }
        .user-menu-dropdown.show { display: block; }
        .user-menu-item { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem; border: none; background: transparent; color: var(--text); cursor: pointer; font-family: 'Outfit'; font-size: 0.9rem; width: 100%; text-align: left; border-bottom: 1px solid var(--border); }
        .user-menu-item:last-child { border-bottom: none; }
        .user-menu-item:hover { background: var(--bg); }
        .user-menu-item.danger { color: var(--red); }

        #toast-container { position: fixed; top: 1.25rem; right: 1.25rem; z-index: 9999; display: flex; flex-direction: column; gap: 0.5rem; }
        .toast { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 0.9rem 1.25rem; box-shadow: var(--shadow-lg); font-size: 0.9rem; font-weight: 500; max-width: 320px; display: flex; align-items: center; gap: 0.75rem; animation: slideIn 0.3s ease; border-left: 4px solid var(--green); }
        .toast.error { border-left-color: var(--red); }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        .empty-state { text-align: center; padding: 3rem 1rem; color: var(--muted); }
        .empty-state i { font-size: 2.5rem; margin-bottom: 1rem; opacity: 0.4; }
        .loading-spinner { display: inline-block; width: 20px; height: 20px; border: 2.5px solid var(--border); border-top-color: var(--red); border-radius: 50%; animation: spin 0.7s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .checkbox-kelas-wrap { border: 2px solid var(--border); border-radius: var(--radius-sm); padding: 0.9rem; max-height: 260px; overflow-y: auto; }
        .checkbox-kelas-cat { font-size: 0.72rem; font-weight: 800; color: var(--red); text-transform: uppercase; letter-spacing: 0.05em; margin: 0.75rem 0 0.4rem; }
        .checkbox-kelas-item { display:flex; align-items:center; gap:0.5rem; font-size:0.86rem; padding: 0.3rem 0; }

        .catatan-container { background: #eff6ff; border: 1px solid #bfdbfe; border-radius: var(--radius-sm); padding: 0.75rem; margin-top: 0.6rem; font-size: 0.82rem; width: 100%; }
        [data-theme="dark"] .catatan-container { background: rgba(30, 58, 138, 0.3); }
        .catatan-label { font-weight: 600; color: #1d4ed8; margin-bottom: 0.3rem; display: flex; align-items: center; gap: 0.4rem; }
        .catatan-text { color: #1e293b; line-height: 1.4; word-break: break-word; }
        [data-theme="dark"] .catatan-text { color: #f1f5f9; }
        .catatan-item + .catatan-item { margin-top: 0.5rem; padding-top: 0.5rem; border-top: 1px dashed #bfdbfe; }
    </style>
</head>
<body>

<div id="toast-container"></div>

<!-- TOP BAR -->
<div id="top-bar" class="top-bar" style="display:none;">
    <div class="top-logo"><span>IMC</span> Portal</div>
    <div class="top-right">
        <button class="theme-btn" onclick="toggleTheme()"><i class="fa-regular fa-moon"></i></button>
        <div class="user-menu">
            <button class="user-chip" onclick="toggleUserMenu()">
                <div class="avatar" id="user-avatar">?</div>
                <span id="user-name-chip">—</span>
                <i class="fa-solid fa-chevron-down" style="font-size:0.7rem;"></i>
            </button>
            <div id="userMenuDropdown" class="user-menu-dropdown">
                <button class="user-menu-item" onclick="openEditProfile()"><i class="fa-solid fa-user-pen"></i> Edit Profile</button>
                <button class="user-menu-item danger" onclick="doLogout()"><i class="fa-solid fa-arrow-right-from-bracket"></i> Keluar</button>
            </div>
        </div>
    </div>
</div>

<!-- MAIN VIEW -->
<div id="app"></div>

<!-- BOTTOM NAV -->
<nav id="bottom-ribbon" class="hidden">
    <div class="ribbon-inner" id="ribbon-links"></div>
</nav>

<!-- AUTH MODAL -->
<div id="authModal" class="modal-overlay">
    <div class="modal-box">
        <div class="modal-icon"><i class="fa-solid fa-graduation-cap"></i></div>
        <div class="modal-title">Indonesia Mind Center</div>
        <div class="modal-sub">Portal Bimbel Eksklusif</div>
        <div class="modal-tabs">
            <button class="modal-tab active" id="tab-login" onclick="switchTab('login')">Masuk</button>
            <button class="modal-tab" id="tab-register" onclick="switchTab('register')">Daftar</button>
        </div>

        <div id="form-login">
            <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" id="loginEmail" class="form-control" placeholder="email@imc.ac.id">
            </div>
            <div class="form-group">
                <label class="form-label">Kata Sandi</label>
                <input type="password" id="loginPassword" class="form-control" placeholder="Minimal 6 karakter">
                <i class="fa-solid fa-eye toggle-password" onclick="togglePassword('loginPassword', this)"></i>
            </div>
            <div class="form-group">
                <label class="form-label">Peran</label>
                <select id="loginRole" class="form-select">
                    <option value="" disabled selected>Pilih Peran</option>
                    <option value="siswa">Siswa</option>
                    <option value="pengajar">Pengajar</option>
                    <option value="admin">Admin</option>
                </select>
            </div>
            <div style="display:flex; gap:0.75rem; margin-top:1.25rem;">
                <button class="btn btn-outline" onclick="closeAuth()" style="flex:1;">Batal</button>
                <button class="btn btn-red btn-full" onclick="processLogin()" style="flex:2;" id="btn-login">Masuk</button>
            </div>
        </div>

        <div id="form-register" style="display:none;">
            <div class="form-group">
                <label class="form-label">Nama Lengkap</label>
                <input type="text" id="regName" class="form-control" placeholder="Nama Anda">
            </div>
            <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" id="regEmail" class="form-control" placeholder="email@imc.ac.id">
            </div>
            <div class="form-group">
                <label class="form-label">Kata Sandi</label>
                <input type="password" id="regPassword" class="form-control" placeholder="Minimal 6 karakter">
                <i class="fa-solid fa-eye toggle-password" onclick="togglePassword('regPassword', this)"></i>
            </div>
            <div class="form-group">
                <label class="form-label">Peran</label>
                <select id="regRole" class="form-select" onchange="onRegRoleChange()">
                    <option value="" disabled selected>Pilih Peran</option>
                    <option value="siswa">Siswa</option>
                    <option value="pengajar">Pengajar</option>
                </select>
            </div>
            <div class="form-group" id="regClassWrap" style="display:none;">
                <label class="form-label">Pilih Kelas (Bisa lebih dari satu)</label>
                <div id="regClassCheckboxes" class="checkbox-kelas-wrap"></div>
            </div>
            <div style="display:flex; gap:0.75rem; margin-top:1.25rem;">
                <button class="btn btn-outline" onclick="closeAuth()" style="flex:1;">Batal</button>
                <button class="btn btn-green btn-full" onclick="processRegister()" style="flex:2;" id="btn-register">Daftar</button>
            </div>
        </div>
    </div>
</div>

<!-- MODALS -->
<div id="editProfileModal" class="modal-overlay">
    <div class="modal-box">
        <div class="modal-title" style="margin-bottom:1.5rem;"><i class="fa-solid fa-user-pen" style="color:var(--red);margin-right:0.5rem;"></i> Edit Profile</div>
        <div class="form-group"><label class="form-label">Nama Lengkap</label><input type="text" id="editNama" class="form-control"></div>
        <div class="form-group" id="editKelasWrap" style="display:none;"><label class="form-label">Kelas</label><div id="editClassCheckboxes" class="checkbox-kelas-wrap"></div></div>
        <div style="display:flex; gap:0.75rem; margin-top:1.5rem;">
            <button class="btn btn-outline" onclick="closeModal('editProfileModal')" style="flex:1;">Batal</button>
            <button class="btn btn-red" onclick="submitEditProfile()" style="flex:2;" id="btn-edit-profile">Simpan</button>
        </div>
    </div>
</div>

<div id="adminEditSiswaModal" class="modal-overlay">
    <div class="modal-box">
        <div class="modal-title" style="margin-bottom:1.5rem;"><i class="fa-solid fa-edit" style="color:var(--blue);margin-right:0.5rem;"></i> Edit Siswa</div>
        <div class="form-group"><label class="form-label">Nama</label><input type="text" id="adminEditNama" class="form-control" disabled></div>
        <div class="form-group"><label class="form-label">Email</label><input type="email" id="adminEditEmail" class="form-control" disabled></div>
        <div class="form-group"><label class="form-label">Kelas</label><div id="adminEditKelasCheckboxes" class="checkbox-kelas-wrap"></div></div>
        <div style="display:flex; gap:0.75rem; margin-top:1.5rem;">
            <button class="btn btn-outline" onclick="closeModal('adminEditSiswaModal')" style="flex:1;">Batal</button>
            <button class="btn btn-blue" onclick="submitAdminEditSiswa()" style="flex:2;" id="btn-admin-edit">Simpan</button>
        </div>
    </div>
</div>

<!-- MODAL TAMBAH JADWAL -->

<script>
// ==============================
// KONFIGURASI KELAS & UTILS
// ==============================
const KELAS_KATEGORI = {
    "KEDOKTERAN & UMUM": [
        { value: "UTBK-KEDOKTERAN", label: "UTBK Kedokteran" }, { value: "UTBK-UMUM", label: "UTBK Umum" },
        { value: "UNISSULA-KEDOKTERAN", label: "UNISSULA Kedokteran" }, { value: "UNIMUS-KEDOKTERAN", label: "Unimus Kedokteran" },
        { value: "UM-UNDIP", label: "UM Undip" }, { value: "UM-UNNES-KEDOKTERAN", label: "UM Unnes Kedokteran" },
        { value: "UTUL-UGM", label: "UTUL UGM" }, { value: "SELMA-UB", label: "SELMA UB" },
        { value: "UGJ", label: "UGJ" }, { value: "UMY", label: "UMY" }, { value: "UNS", label: "UNS" }, { value: "UMS", label: "UMS" },
    ],
    "KEDINASAN": [
        { value: "AKPOL", label: "AKPOL" }, { value: "AKMIL", label: "AKMIL" }, { value: "IPDN", label: "IPDN" },
        { value: "STAN", label: "STAN" }, { value: "STIN", label: "STIN" }, { value: "STIS", label: "STIS" },
        { value: "STMKG", label: "STMKG" }, { value: "STTD", label: "STTD" }, { value: "POLTEKES", label: "Poltekes" },
        { value: "AAL", label: "AAL" }, { value: "AAU", label: "AAU" }, { value: "CPNS", label: "CPNS" },
        { value: "BINTARA", label: "Bintara" }, { value: "PIP", label: "PIP" },
    ],
    "KEDINASAN GABUNGAN": [{ value: "KEDINASAN-GABUNGAN", label: "Kedinasan Gabungan" }]
};

function getLabelKelas(val) {
    for (const kat in KELAS_KATEGORI) { const f = KELAS_KATEGORI[kat].find(k => k.value === val); if (f) return f.label; }
    return val;
}
function badgeKelas(val) {
    let kat = null;
    for (const k in KELAS_KATEGORI) { if(KELAS_KATEGORI[k].some(x => x.value === val)) kat = k; }
    const cls = kat === 'KEDINASAN' ? 'badge-blue' : (kat ? 'badge-red' : 'badge-muted');
    return `<span class="badge ${cls}">${getLabelKelas(val)}</span>`;
}
function renderKelasCheckboxesGrouped() {
    let html = '';
    for (const kat in KELAS_KATEGORI) {
        html += `<div class="checkbox-kelas-cat">${kat}</div>`;
        html += KELAS_KATEGORI[kat].map(k => `<label class="checkbox-kelas-item"><input type="checkbox" value="${k.value}"> ${k.label}</label>`).join('');
    }
    return html;
}
function renderKelasOptionsGrouped() {
    let html = '';
    for (const kat in KELAS_KATEGORI) {
        html += `<optgroup label="${kat}">`;
        html += KELAS_KATEGORI[kat].map(k => `<option value="${k.value}">${k.label}</option>`).join('');
        html += `</optgroup>`;
    }
    return html;
}

function escapeHtml(str) {
    if (str == null) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function formatTanggalLengkap(dateStr) {
    if (!dateStr) return { dayName:'—', day:'—', month:'—' };
    const d = new Date(dateStr + 'T00:00:00');
    return {
        dayName: d.toLocaleString('id-ID', { weekday: 'short' }),
        day: d.getDate(),
        month: d.toLocaleString('id-ID', { month: 'short' })
    };
}

function toast(msg, type='success') {
    const el = document.createElement('div');
    el.className = 'toast ' + (type==='error'?'error':'');
    el.innerHTML = `<i class="fa-solid ${type==='success'?'fa-circle-check':'fa-circle-exclamation'}"></i> ${msg}`;
    document.getElementById('toast-container').appendChild(el);
    setTimeout(() => el.remove(), 4000);
}
function closeModal(id) { document.getElementById(id).classList.remove('show'); }
function setLoading(id, isLoading, text='') {
    const el = document.getElementById(id);
    if(el) { el.disabled = isLoading; el.innerHTML = isLoading ? '<div class="loading-spinner"></div>' : text; }
}
function toggleTheme() {
    const d = document.documentElement;
    d.getAttribute('data-theme') === 'dark' ? d.removeAttribute('data-theme') : d.setAttribute('data-theme','dark');
}
function toggleUserMenu() {
    document.getElementById('userMenuDropdown').classList.toggle('show');
    document.addEventListener('click', closeUserMenuOutside, true);
}
function closeUserMenuOutside(e) {
    const menu = document.getElementById('userMenuDropdown');
    const chip = document.querySelector('.user-chip');
    if (!menu.contains(e.target) && !chip.contains(e.target)) {
        menu.classList.remove('show');
        document.removeEventListener('click', closeUserMenuOutside, true);
    }
}
function togglePassword(inputId, iconEl) {
    const input = document.getElementById(inputId);
    if (input.type === 'password') {
        input.type = 'text';
        iconEl.classList.replace('fa-eye', 'fa-eye-slash');
    } else {
        input.type = 'password';
        iconEl.classList.replace('fa-eye-slash', 'fa-eye');
    }
}

// ==============================
// STATE & CORE
// ==============================
window.currentUser = null;
let currentView = 'public';
let currentWeekOffset = 0;
let adminFilterStatus = 'all'; // State Filter Admin: 'all', 'pending', 'selesai'
let chatSubscription = null;
let editingSiswaId = null, editingJadwalId = null, selectedJadwalForCatatan = null, selectedCatatanId = null;
let adminIsAddingJadwal = false;

function getWeekRange(offsetWeeks = 0) {
    const curr = new Date();
    const first = curr.getDate() - curr.getDay() + 1 + (offsetWeeks * 7);
    const start = new Date(curr.setDate(first));
    const end = new Date(curr.setDate(first + 6));
    return {
        start: start.toISOString().split('T')[0],
        end: end.toISOString().split('T')[0],
        label: `${start.toLocaleDateString('id-ID',{day:'numeric',month:'short'})} - ${end.toLocaleDateString('id-ID',{day:'numeric',month:'short'})}`
    };
}
function changeWeek(offset) {
    currentWeekOffset += offset;
    if (currentView === 'siswa-jadwal') renderSiswaJadwal();
    else if (currentView === 'pengajar-jadwal') renderPengajarJadwal();
    else if (currentView === 'admin-jadwal') renderAdminJadwal();
}
function renderWeekControls() {
    const range = getWeekRange(currentWeekOffset);
    return `
    <div class="week-controls">
        <button onclick="changeWeek(-1)"><i class="fa-solid fa-chevron-left"></i> Minggu Lalu</button>
        <div class="week-label">${range.label}</div>
        <button onclick="changeWeek(1)">Minggu Depan <i class="fa-solid fa-chevron-right"></i></button>
    </div>`;
}

// ==============================
// AUTH
// ==============================
window.showAuth = function() {
    document.getElementById('regClassCheckboxes').innerHTML = renderKelasCheckboxesGrouped();
    document.getElementById('authModal').classList.add('show');
}
window.closeAuth = function() { closeModal('authModal'); }
window.switchTab = function(t) {
    document.getElementById('form-login').style.display = t==='login' ? 'block' : 'none';
    document.getElementById('form-register').style.display = t==='register' ? 'block' : 'none';
    document.getElementById('tab-login').classList.toggle('active', t==='login');
    document.getElementById('tab-register').classList.toggle('active', t==='register');
}
window.onRegRoleChange = function() { document.getElementById('regClassWrap').style.display = 'block'; }

window.processLogin = async function() {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    const role = document.getElementById('loginRole').value;
    if (!email || !password || !role) return toast('Isi semua field!', 'error');

    setLoading('btn-login', true);
    try {
        const { data, error } = await window.sb.auth.signInWithPassword({ email, password });
        if(error) throw error;
        const { data: profile } = await window.sb.from('profiles').select('*').eq('id', data.user.id).single();
        if (profile.role !== role) {
            await window.sb.auth.signOut();
            throw new Error(`Akun ini terdaftar sebagai "${profile.role}".`);
        }
        closeAuth(); toast(`Selamat datang, ${profile.nama}!`);
        await loadProfileAndRoute();
    } catch(e) { toast(e.message, 'error'); }
    setLoading('btn-login', false, 'Masuk');
}

window.processRegister = async function() {
    const nama = document.getElementById('regName').value.trim(), email = document.getElementById('regEmail').value.trim();
    const password = document.getElementById('regPassword').value, role = document.getElementById('regRole').value;
    const kelas = [...document.querySelectorAll('#regClassCheckboxes input:checked')].map(c=>c.value);
    
    if (!nama || !email || !password || !role) return toast('Isi semua field!', 'error');
    if (kelas.length === 0) return toast('Pilih minimal satu kelas!', 'error');

    setLoading('btn-register', true);
    try {
        const { error } = await window.sb.auth.signUp({ email, password, options: { data: { nama, role, kelas_list: kelas } } });
        if(error) throw error;
        closeAuth(); toast('Akun berhasil dibuat! Silakan masuk.');
    } catch(e) { toast(e.message, 'error'); }
    setLoading('btn-register', false, 'Daftar');
}
window.doLogout = async function() { 
    if(!confirm('Yakin ingin keluar?')) return;
    await window.sb.auth.signOut(); window.location.reload(); 
}

// ==============================
// NAVIGATION & ROUTING
// ==============================
async function loadProfileAndRoute() {
    const { data: { user } } = await window.sb.auth.getUser();
    if (!user) return showView('public');
    
    const { data: profile, error } = await window.sb.from('profiles').select('*').eq('id', user.id).single();
    if (error || !profile) { await window.sb.auth.signOut(); return showView('public'); }
    
    window.currentUser = profile;
    document.getElementById('user-name-chip').textContent = profile.nama.split(' ')[0];
    document.getElementById('user-avatar').textContent = profile.nama.charAt(0).toUpperCase();
    document.getElementById('top-bar').style.display = 'flex';
    document.getElementById('bottom-ribbon').classList.remove('hidden');
    
    renderRibbon(profile.role);
    initChatListener();
    
    if (profile.role === 'admin') showView('admin-dashboard');
    else if (profile.role === 'pengajar') showView('pengajar-dashboard');
    else showView('siswa-dashboard');
}

function renderRibbon(role) {
    const menus = {
        siswa: [{ i:'fa-house', lbl:'Beranda', v:'siswa-dashboard' }, { i:'fa-calendar-days', lbl:'Jadwal', v:'siswa-jadwal' }, { i:'fa-folder-open', lbl:'Materi', v:'siswa-materi' }, { i:'fa-comments', lbl:'Chat', v:'chat-global'}],
        pengajar: [{ i:'fa-house', lbl:'Beranda', v:'pengajar-dashboard' }, { i:'fa-calendar-plus', lbl:'Jadwal', v:'pengajar-jadwal' }, { i:'fa-file-arrow-up', lbl:'Upload', v:'pengajar-upload' }, { i:'fa-comments', lbl:'Chat', v:'chat-global'}],
        admin: [{ i:'fa-gauge', lbl:'Dashboard', v:'admin-dashboard' }, { i:'fa-users', lbl:'Siswa', v:'admin-siswa' }, { i:'fa-calendar-check', lbl:'Jadwal', v:'admin-jadwal' }, { i:'fa-comments', lbl:'Chat', v:'chat-global'}]
    };
    document.getElementById('ribbon-links').innerHTML = menus[role].map(m => `
        <button class="ribbon-btn" onclick="showView('${m.v}')" data-view="${m.v}"><i class="fa-solid ${m.i}"></i><span>${m.lbl}</span></button>
    `).join('');
}

window.showView = function(v) { 
    currentView = v; 
    document.querySelectorAll('.ribbon-btn').forEach(btn => btn.classList.toggle('active', btn.getAttribute('data-view')===v));
    
    if(v === 'public') renderPublic();
    else if(v === 'siswa-dashboard') renderSiswaDashboard();
    else if(v === 'siswa-jadwal') renderSiswaJadwal();
    else if(v === 'siswa-materi') renderSiswaMateri();
    else if(v === 'pengajar-dashboard') renderPengajarDashboard();
    else if(v === 'pengajar-jadwal') renderPengajarJadwal();
    else if(v === 'pengajar-upload') renderPengajarUpload();
    else if(v === 'admin-dashboard') renderAdminDashboard();
    else if(v === 'admin-siswa') renderAdminSiswa();
    else if(v === 'admin-jadwal') renderAdminJadwal();
    else if(v === 'chat-global') renderChatGlobal();
}

function renderPublic() {
    document.getElementById('app').innerHTML = `
    <div class="container" style="max-width:700px;">
        <div class="hero">
            <div class="hero-logo"><span class="imc">IMC</span></div>
            <div style="font-weight:600;color:var(--muted);letter-spacing:0.08em;margin-bottom:0.75rem;">INDONESIA MIND CENTER</div>
            <p class="hero-sub">Platform bimbingan belajar terpadu dengan Filter Status Jadwal Admin.</p>
            <div class="hero-btns">
                <button class="btn btn-red" onclick="showAuth(); switchTab('login')">Masuk</button>
                <button class="btn btn-green" onclick="showAuth(); switchTab('register')">Daftar</button>
            </div>
        </div>
    </div>`;
}

async function loadCatatanMap(jadwalIds) {
    const map = {};
    if (!jadwalIds || jadwalIds.length === 0) return map;
    try {
        const { data } = await window.sb.from('jadwal_catatan_siswa').select('*').in('jadwal_id', jadwalIds).order('created_at');
        (data || []).forEach(c => {
            if (!map[c.jadwal_id]) map[c.jadwal_id] = [];
            map[c.jadwal_id].push(c);
        });
    } catch(e) {}
    return map;
}

// ==============================
// RENDER JADWAL
// ==============================
function jadwalItemHtml(j, roleType, catatanList=[]) {
    const { dayName, day, month } = formatTanggalLengkap(j.tanggal);
    const isSelesai = j.status === 'selesai';
    const statusHtml = isSelesai ? `<span class="badge badge-green"><i class="fa-solid fa-check-circle"></i> Selesai</span>` : `<span class="badge badge-red">Pending</span>`;
    
    const formatJam = j.jam_selesai ? `${j.jam} - ${j.jam_selesai}` : (j.jam || '—');

    let catatanHtml = '';
    if (roleType === 'siswa') {
        const mine = catatanList.find(c => c.siswa_id === window.currentUser.id);
        if (mine) catatanHtml = `<div class="catatan-container"><div class="catatan-label">Catatan Anda</div><div class="catatan-text">${escapeHtml(mine.catatan)}</div></div>`;
    } else if (roleType === 'admin' || roleType === 'pengajar') {
        if (catatanList.length > 0) {
            catatanHtml = `<div class="catatan-container"><div class="catatan-label">Catatan Siswa (${catatanList.length})</div>
            ${catatanList.map(c => `<div class="catatan-item"><div style="font-weight:600;font-size:0.8rem;color:#1d4ed8;">${escapeHtml(c.siswa_nama)}</div><div class="catatan-text">${escapeHtml(c.catatan)}</div></div>`).join('')}</div>`;
        }
    }

    let actionsHtml = '';
    if (roleType === 'siswa') {
        const mine = catatanList.find(c => c.siswa_id === window.currentUser.id);
        actionsHtml = `<button class="btn btn-yellow btn-sm" onclick="openSiswaCatatanModal('${j.id}', '${(j.judul||'').replace(/'/g,"\\'")}', '${j.tanggal||''}', '${formatJam}', '${mine?mine.id:''}', '${mine?(mine.catatan||'').replace(/'/g,"\\'").replace(/\n/g,'\\n'):''}')"><i class="fa-solid ${mine?'fa-pen':'fa-note-sticky'}"></i> ${mine?'Edit Catatan':'Tambah Catatan'}</button>`;
    } else if (roleType === 'pengajar') {
        if (!isSelesai) {
            actionsHtml += `<button class="btn btn-green btn-sm" onclick="fiksasiJadwal('${j.id}')"><i class="fa-solid fa-check"></i> Selesai</button>`;
        }
        actionsHtml += `<button class="btn btn-danger btn-sm" onclick="deleteJadwal('${j.id}')"><i class="fa-solid fa-trash"></i></button>`;
    } else if (roleType === 'admin') {
        actionsHtml += `<button class="btn btn-blue btn-sm" onclick="openAdminEditJadwal('${j.id}', '${(j.judul||'').replace(/'/g,"\\'")}', '${j.tanggal||''}', '${j.jam||''}', '${j.jam_selesai||''}', '${(j.ruangan||'').replace(/'/g,"\\'")}', '${(j.catatan||'').replace(/'/g,"\\'")}')"><i class="fa-solid fa-edit"></i></button>
        <button class="btn btn-danger btn-sm" onclick="deleteAdminJadwal('${j.id}')"><i class="fa-solid fa-trash"></i></button>`;
    }

    return `
    <div class="jadwal-item">
        <div class="jadwal-date">
            <span class="day-name">${dayName}</span>
            <div class="day">${day}</div>
            <div class="month">${month}</div>
        </div>
        <div class="jadwal-info">
            <div class="jadwal-title">${escapeHtml(j.judul)||'Tanpa Judul'} ${statusHtml}</div>
            <div class="jadwal-meta">
                <span><i class="fa-regular fa-clock"></i> ${formatJam} WIB</span> •
                <span><i class="fa-solid fa-location-dot"></i> ${escapeHtml(j.ruangan)||'—'}</span> •
                ${badgeKelas(j.kelas||'')}
            </div>
            ${j.catatan ? `<div class="jadwal-meta" style="margin-top:0.3rem;"><i class="fa-regular fa-note-sticky"></i> ${escapeHtml(j.catatan)}</div>` : ''}
            <div class="jadwal-meta" style="margin-top:0.25rem;">👤 Pengajar: ${escapeHtml(j.pengajar_nama)||'—'}</div>
            ${catatanHtml}
        </div>
        <div style="display:flex;gap:0.4rem;flex-wrap:wrap;align-items:flex-start;">
            ${actionsHtml}
        </div>
    </div>`;
}

window.fiksasiJadwal = async function(id) {
    if(!confirm('Tandai jadwal ini sudah dilaksanakan?')) return;
    try {
        await window.sb.from('jadwal').update({ status: 'selesai' }).eq('id', id);
        toast('Jadwal ditandai selesai.');
        renderPengajarJadwal();
    } catch(e) { toast('Gagal', 'error'); }
}
window.deleteJadwal = async function(id) {
    if(!confirm('Hapus jadwal ini?')) return;
    await window.sb.from('jadwal').delete().eq('id', id); toast('Dihapus.'); renderPengajarJadwal();
}
window.deleteAdminJadwal = async function(id) {
    if(!confirm('Hapus jadwal ini?')) return;

window.setAdminFilterStatus = function(status) {
    adminFilterStatus = status;
    renderAdminJadwal();
}

async function renderAdminJadwal() {
    const range = getWeekRange(currentWeekOffset);
    document.getElementById('app').innerHTML = `
    <div class="container">
        <div class="page-header">
            <div class="page-title">Kelola <span>Jadwal</span></div>
            <div style="display:flex; gap:0.5rem; flex-wrap:wrap;">
                <button class="btn btn-green btn-sm" onclick="exportExcelJadwal()"><i class="fa-solid fa-file-excel"></i> Export Excel</button>
                <button class="btn btn-red btn-sm" onclick="openAdminAddJadwalModal()"><i class="fa-solid fa-plus"></i> Tambah</button>
            </div>
        </div>
        ${renderWeekControls()}
        
        <!-- FITUR BARU: Filter Status Pembagi (Semua / Belum Selesai / Selesai) -->
        <div class="filter-status-bar">
            <button class="filter-btn ${adminFilterStatus === 'all' ? 'active' : ''}" onclick="setAdminFilterStatus('all')">Semua Status</button>
            <button class="filter-btn ${adminFilterStatus === 'pending' ? 'active' : ''}" onclick="setAdminFilterStatus('pending')">Belum Selesai (Pending)</button>
            <button class="filter-btn ${adminFilterStatus === 'selesai' ? 'active' : ''}" onclick="setAdminFilterStatus('selesai')">Sudah Selesai</button>
        </div>

        <div class="card"><div id="admin-jadwal-list"><div class="loading-spinner"></div></div></div>
    </div>`;

    let query = window.sb.from('jadwal').select('*').gte('tanggal', range.start).lte('tanggal', range.end);
    
    // Terapkan filter berdasarkan status
    if (adminFilterStatus === 'pending') {
        query = query.or('status.eq.pending,status.is.null');
    } else if (adminFilterStatus === 'selesai') {
        query = query.eq('status', 'selesai');
    }

    const { data } = await query.order('tanggal');
    const cMap = await loadCatatanMap((data || []).map(j=>j.id));
    
    document.getElementById('admin-jadwal-list').innerHTML = (data && data.length) ? data.map(j => jadwalItemHtml(j, 'admin', cMap[j.id]||[])).join('') : `<div class="empty-state">Tidak ada jadwal dengan status ini di minggu ini.</div>`;
}

window.exportExcelJadwal = async function() {
    const range = getWeekRange(currentWeekOffset);
    let query = window.sb.from('jadwal').select('*').gte('tanggal', range.start).lte('tanggal', range.end);
    if (adminFilterStatus === 'pending') query = query.or('status.eq.pending,status.is.null');
    else if (adminFilterStatus === 'selesai') query = query.eq('status', 'selesai');

    const { data } = await query.order('tanggal');
    if (!data || data.length === 0) return toast('Tidak ada data jadwal untuk diekspor.', 'error');
    
    const wsData = data.map(j => ({
        'Mata Pelajaran': j.judul, 'Tanggal': j.tanggal,
        'Jam Mulai': j.jam, 'Jam Selesai': j.jam_selesai || '-',
        'Kelas': getLabelKelas(j.kelas), 'Ruangan': j.ruangan,
        'Pengajar': j.pengajar_nama, 'Status': j.status === 'selesai' ? 'Selesai' : 'Pending'
    }));
    const ws = XLSX.utils.json_to_sheet(wsData);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Rekap Jadwal");
    XLSX.writeFile(wb, `Rekap_Jadwal_${adminFilterStatus}_${range.start}.xlsx`);
    toast('Excel diunduh!');
}

async function renderChatGlobal() {
    document.getElementById('app').innerHTML = `<div class="container"><div class="page-header"><div class="page-title"><i class="fa-solid fa-comments"></i> Live <span>Chat Forum</span></div></div><div class="chat-container"><div class="chat-messages" id="chat-messages-box"><div class="loading-spinner"></div></div><div class="chat-input-area"><input type="text" id="chatInput" class="form-control" placeholder="Tulis pesan..." onkeypress="if(event.key==='Enter') sendChat()"><button class="btn btn-red" onclick="sendChat()"><i class="fa-solid fa-paper-plane"></i></button></div></div></div>`;
    const { data } = await window.sb.from('chat_messages').select('*').order('created_at', { ascending: false }).limit(50);
    renderChatList(data ? data.reverse() : []);
}

function renderChatList(messages) {
    const box = document.getElementById('chat-messages-box');
    if(!box) return;
    box.innerHTML = messages.map(m => {
        const isMe = m.sender_id === window.currentUser.id;
        const time = new Date(m.created_at).toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'});
        return `<div class="chat-bubble ${isMe ? 'me' : 'other'}">${!isMe ? `<div class="chat-sender"><span>${escapeHtml(m.sender_nama)} (${m.sender_role})</span> <span class="chat-time">${time}</span></div>` : `<div class="chat-sender" style="justify-content:flex-end;"><span class="chat-time">${time}</span></div>`}<div>${escapeHtml(m.message)}</div></div>`;
    }).join('');
    box.scrollTop = box.scrollHeight;
}

window.sendChat = async function() {
    const input = document.getElementById('chatInput');
    const msg = input.value.trim();
    if(!msg) return;
    input.value = '';
    await window.sb.from('chat_messages').insert({ sender_id: window.currentUser.id, sender_nama: window.currentUser.nama, sender_role: window.currentUser.role, message: msg });
}

function initChatListener() {
    if(chatSubscription) return;
    chatSubscription = window.sb.channel('public:chat_messages')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'chat_messages' }, async () => {
            if(currentView === 'chat-global') {
                const { data } = await window.sb.from('chat_messages').select('*').order('created_at', { ascending: false }).limit(50);
                renderChatList(data.reverse());
            }
        }).subscribe();
}

window.submitJadwal = async function() {
    const payload = {
        judul: document.getElementById('jadwalJudul').value, tanggal: document.getElementById('jadwalTanggal').value,
        jam: document.getElementById('jadwalJamMulai').value, jam_selesai: document.getElementById('jadwalJamSelesai').value,
        ruangan: document.getElementById('jadwalRuangan').value, kelas: document.getElementById('jadwalKelas').value,
        catatan: document.getElementById('jadwalCatatan').value, pengajar_id: window.currentUser.id,
        pengajar_nama: adminIsAddingJadwal ? `${window.currentUser.nama} (Admin)` : window.currentUser.nama, status: 'pending'
    };
    if(!payload.judul || !payload.tanggal || !payload.jam || !payload.kelas) return toast('Isi field wajib!', 'error');
    setLoading('btn-jadwal-submit', true);
    const { error } = await window.sb.from('jadwal').insert(payload);
    setLoading('btn-jadwal-submit', false, 'Simpan Jadwal');
    if(error) return toast('Gagal!', 'error');
    closeModal('jadwalModal'); toast('Berhasil.'); adminIsAddingJadwal ? renderAdminJadwal() : renderPengajarJadwal();
}

window.openUploadModal = function() {
    document.getElementById('fileKelas').innerHTML = `<option value="" disabled selected>Pilih Kelas</option>` + (window.currentUser.kelas_list||[]).map(k=>`<option value="${k}">${getLabelKelas(k)}</option>`).join('');
    document.getElementById('uploadModal').classList.add('show');
}
window.submitUpload = async function() {
    const judul = document.getElementById('fileJudul').value, mapel = document.getElementById('fileMapel').value, kelas = document.getElementById('fileKelas').value;
    const file = document.getElementById('fileInput').files[0];
    if(!judul || !kelas || !file) return toast('Lengkapi data', 'error');
    setLoading('btn-upload-submit', true);
    try {
        const path = `soal/${kelas}/${Date.now()}_${file.name}`;
        await window.sb.storage.from('soal-pdf').upload(path, file, { contentType: 'application/pdf' });
        await window.sb.from('soal_files').insert({judul, mapel, kelas, storage_path: path, file_name: file.name, file_size: file.size, pengajar_id: window.currentUser.id, pengajar_nama: window.currentUser.nama});
        closeModal('uploadModal'); toast('Berhasil'); renderPengajarUpload();
    } catch(e) { toast('Gagal', 'error'); }
    setLoading('btn-upload-submit', false, 'Upload');
}
window.downloadFile = async function(path) {
    const { data } = await window.sb.storage.from('soal-pdf').createSignedUrl(path, 60);
    window.open(data.signedUrl, '_blank');
}
window.deleteFile = async function(id, path) {
    if(!confirm('Hapus?')) return;
    await window.sb.storage.from('soal-pdf').remove([path]);
    await window.sb.from('soal_files').delete().eq('id', id); toast('Dihapus'); renderPengajarUpload();
}
function fileItemHtml(f, canDelete) {
    return `<div class="file-item"><div class="file-icon">📄</div><div class="file-info"><div class="file-name">${escapeHtml(f.judul||f.file_name)}</div><div class="file-meta">${badgeKelas(f.kelas)}</div></div><div class="file-actions"><button class="btn btn-blue btn-sm" onclick="downloadFile('${f.storage_path}')"><i class="fa-solid fa-download"></i></button>${canDelete?`<button class="btn btn-danger btn-sm" onclick="deleteFile('${f.id}','${f.storage_path}')"><i class="fa-solid fa-trash"></i></button>`:''}</div></div>`;
}
